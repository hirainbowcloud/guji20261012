<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>First Javascript Page</title>       
</head>
<body>
   <h1>Welcome to the JS Page</h1>
   <button onclick="show_attributes()">show attribute</button>
    <button onclick="change_attr()">change attribute</button>
   <script>
       function show_attributes() {
           var foo = document.querySelector('#foo');
           console.log(foo.getAttribute('href'));
           console.log(foo.getAttribute('target'));
           console.log(foo.getAttribute('data-foo'));
       }
       function change_attr() {
           var foo = document.querySelector('#foo');
           foo.setAttribute('href', 'http://www.google.com/');
           foo.setAttribute('target', '_self');
           foo.setAttribute('data-foo', 'bar');
           foo.innerText="Google";
       }
   </script>
   <p></p>
   <a id="foo" href="http://tw.yahoo.com/" target="_blank" data-foo>Yahoo</a>
</body>
</html>
