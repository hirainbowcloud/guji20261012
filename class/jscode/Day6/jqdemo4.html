<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>jQuery Javascript Page</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>

</head>

<body>
    <h1>Welcome to the JQuery Page</h1>
    <button id="bt1">Show Table</button>
     <button id="bt2">Find</button>
    <div class="grand-parent">
         <ul class="parent">
            <li class="child">Child 1</li>
            <li class="child">Child 2</li>
            <li class="child">Child 3</li>
        </ul>
    </div>
    <ul class="parent2">
            <li class="child">Child 4</li>
            <li class="child">Child 5</li>
            <li class="child">Child 6</li>
    </ul>
    <table id="product" border="0" width="50%"></table>
    <script>
        const showTable = () => {
            var arr = [
                { "name": "Apple", "price": 60 },
                { "name": "Lemon", "price": 90 },
                { "name": "Cherry", "price": 300 }
            ];
            $.each(arr, function (i) {
                var row = $("<tr></tr>");
                $("<td></td>").text(i + 1).appendTo(row);
                $("<td></td>").text(this.name).appendTo(row);
                $("<td></td>").text(this.price).appendTo(row);
                $("#product").append(row);
            });
            $("#product").attr("border", "1").attr("width", "50%");
        };
        const start = () => {
            $("#bt1").click(showTable);
            $("#bt2").click(() => {
               // find：在選取元素底下搜尋
               $(".grand-parent").find("li").css("border", "2px solid red");
            });
        };
        $(document).ready(start);
    </script>
</body>

</html>
