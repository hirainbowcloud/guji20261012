<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>First Javascript Page</title>
    <script>       
  
        const remove_ul = () => {
            var ul = document.getElementById('firstUL');
            if (ul.firstChild) {
                ul.removeChild(ul.firstChild);
            }
        };       
        const remove_tb = () => {
            var table = document.getElementById('tb1');
            if (table.rows.length > 0) {
                table.deleteRow(0);
            }
        };
        const remove_ul60 = () => {
            var ul = document.getElementById('score');
            var items = ul.getElementsByTagName('li');
            for (var i = items.length - 1; i >= 0; i--) {
                if (parseInt(items[i].textContent) < 60) {
                    ul.removeChild(items[i]);
                }
            }
        };
    </script>
</head>

<body>
    <h1>Welcome to the JS Page</h1>
    <button onclick="remove_ul()">remove li element</button>
    <button onclick="remove_tb()">remove table row</button>
    <button onclick="remove_ul60()">remove li element below 60</button>
    <!-- removeChild：移除子節點，並回傳被移除的元素 -->
    <ul id="firstUL"><li>1</li><li>2</li><li>3</li></ul>
    <table id="tb1" border="1" width="50%">
       <tr><td>MYSQL DB</td><td>500</td></tr>
       <tr><td>JS Guide</td><td>300</td></tr>
    </table>
    <ul id="score">
        <li>60</li>
        <li>85</li>
        <li>55</li>
        <li>40</li>
        <li>90</li>
    </ul>
</body>

</html>
