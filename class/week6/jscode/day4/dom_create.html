<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>First Javascript Page</title>
    <script>
        var books=[{name:'MYSQL DB', price:500},{name:'JS Guide', price:300}];
        const create = () => {
            var head = document.getElementById('firstUL');
            for (var i = 1; i <= 3; i++) {
                var li01 = document.createElement("li");
                li01.innerHTML = "顯示的文字 " + i;
                head.appendChild(li01);
            }
        };
        const create_tb = () => {
            // 新增表格列
            var table = document.getElementById('tb1');
            var newRow = table.insertRow(-1);       // -1 = 加到最後一列
            var cell1 = newRow.insertCell();
            cell1.textContent = 'Book Name';
            var cell2 = newRow.insertCell();
            cell2.textContent = 'Book Price';

            for (var i = 0; i < books.length; i++) {
                newRow = table.insertRow(-1);
                cell1 = newRow.insertCell();
                cell1.textContent = books[i].name;
                cell2 = newRow.insertCell();
                cell2.textContent = books[i].price;
            }
            

        };
    </script>
</head>

<body>
    <h1>Welcome to the JS Page</h1>
    <button onclick="create()">Create li elements</button>
    <button onclick="create_tb()">Create table rows</button>
    <ul id="firstUL"></ul>
    <table id="tb1" border="1" width="50%">

    </table>
</body>

</html>
