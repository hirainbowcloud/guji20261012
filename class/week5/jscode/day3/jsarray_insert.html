<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>First Javascript Page</title>
    <script>
       var array_insert=()=>{
        let array = [1, 2, 3, 4, 5];
        let element = prompt("Enter an element to insert:");
        let position = prompt("Enter the position to insert the element at:");
        array.splice(position, 0, element);
        alert("Updated array: " + array);
       };
    </script>
</head>
<body>
   <h1>Welcome to the JS Page</h1>
   <button onclick="array_insert()">點擊</button>
   
</body>
</html>
