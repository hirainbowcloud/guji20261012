<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>jQuery Javascript Page</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>

</head>

<body>
    <h1>Welcome to the JQuery Page</h1>
    <button id="bt1">First Button</button>
    <form action="javascript:alert('Form submitted!');" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="Mary"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="mary@example.com"><br><br>
        <input type="submit" value="Submit">
    </form>
    <script>
        const btnClick = () => {
            alert("Button clicked!");
        };
        const executeForm = (e) => {
            e.preventDefault();
            //alert("Form submitted!");
            let mydata = $("form").serialize();
            //$.post("http://localhost:8080/api/send",  data,   result)
            $.ajax({
                url: 'http://localhost:8080/api/send',
                type: 'post',
                dataType: 'json',                            // 伺服器回傳格式
                contentType: 'application/x-www-form-urlencoded;charset=UTF-8',  // 傳送格式
                data: mydata,
                success: function (result) {
                    alert(JSON.stringify(result));                             // result 是 json 物件
                }
            });

        };
        const result = (value) => {
            console.log("person:" + JSON.stringify(value));
            //alert(value);
        };
        const start = () => {
            console.log("Hello from JQuery");
            $("#bt1").click(btnClick);
            $("form").submit(executeForm);
        };

        $(document).ready(start);
    </script>
</body>

</html>
