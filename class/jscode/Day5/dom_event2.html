<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>First Javascript Page</title>    
    
</head>
<body>
   <h1>Welcome to the JS Page</h1>
   <div id="scene" style="width: 320px; height: 280px; background-color: lightblue;"></div>
   <p></p>
    <script>
       var scene = document.querySelector('#scene');
       scene.addEventListener('mouseover', function() {
           console.log ('Scene Mouse Over Div!');
       });
        scene.addEventListener('mouseout', function() {
           console.log ('Scene Mouse Out Div!');
       });
    </script>
</body>
</html>
