<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>First Javascript Page</title>    
    <script>
      async function fetchData() {
           const response = await fetch('https://fakestoreapi.com/products');
           try {
               const data = await response.json();
               console.log(data);
           } catch (error) {
               console.error('Error:', error);
           }
       }
      async function fetchTBData() {
           const response = await fetch('https://fakestoreapi.com/products');
           try {
               const data = await response.json();
               const table = document.querySelector('#tb1');
               table.innerHTML = '<tr><th>ID</th><th>Title</th><th>Price</th><th>Image</th></tr>';
               data.forEach(item => {
                   const row = document.createElement('tr');
                   row.innerHTML = `<td>${item.id}</td><td>${item.title}</td><td>${item.price}</td><td><img src="${item.image}" width="50"/></td>`;
                   table.appendChild(row);
               });
           } catch (error) {
               console.error('Error:', error);
           }
       }
    </script>
</head>
<body>
   <h1>Welcome to the JS Page</h1>
   <button onclick="fetchData()">Fetch API</button>
   <button onclick="fetchTBData()">Fetch API Table </button>
   <table id="tb1" width="90%">    

   </table>
</body>
</html>
