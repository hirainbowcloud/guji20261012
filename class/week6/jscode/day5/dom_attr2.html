<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>First Javascript Page</title>    
    <script>
       function change_picture() {
          let pic = document.querySelector('#pic');
          let picName = prompt("Enter the picture name:");
          pic.setAttribute('src', './images/' + picName);
       }
    </script>
</head>
<body>
   <h1>Welcome to the JS Page</h1>
   <button onclick="change_picture()">change picture</button>
   <p></p>
   <img id="pic" src="./images/banana.png" alt="Picture" width="320px" height="240px"/>
</body>
</html>
