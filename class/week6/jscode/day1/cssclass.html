<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>First Page</title>
    <style>
        .highlight {
            color: red;                
        }
        .blue{
            color: blue;
        }
        .big48{
            font-size: 48px;
        }
        #id01{
            font-size: 24px;
            color: green;
        }
    </style>
</head>
<body>
   <h1 class="blue">Welcome to the First Page</h1>
   <h2 class="blue">Welcome to the First Page</h2>
   <h3 class="blue">Welcome to the First Page</h3>
   <p class="highlight big48">This is a simple HTML page created for the first day of learning HTML.</p>
   <p id="id01">This paragraph has an ID selector applied.</p>
</body>
</html>
