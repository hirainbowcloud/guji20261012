<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜數字遊戲</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: 0 auto; text-align: center; }
        input[type="text"] { padding: 10px; margin: 10px; width: 100px; }
        input[type="submit"] { padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 猜數字遊戲</h1>
        <p>我想了一個 1 到 10 之間的數字，你能猜中嗎？</p>
        <form  id="guessForm" action="Fortune.jsp" method="post">
            <label for="number">請輸入您的猜測 (1-10)：</label><br/>
            <input type="text" name="number" id="number" required /><br/>
            <input type="submit" name="submit" value="開始猜測" />
        </form>
    </div>
    
    <!-- 2. 加入 JavaScript 程式碼 -->
<script>
    document.getElementById('guessForm').addEventListener('submit', function(event) {
        // 抓取輸入框的值
        const userNumber = document.getElementById('number').value;
        
        // 在控制台印出數值
        console.log("使用者輸入的數字是：", userNumber);
        
        // 💡 重點：為了避免跳頁太快看不到，這裡強制暫停 2 秒（2000毫秒）後再送出表單
        event.preventDefault(); // 先阻止表單立刻送出
        
        setTimeout(() => {
            this.submit(); // 2 秒後由程式觸發送出表單並跳頁
        }, 5000);
    });
</script>
</body>
</html>
